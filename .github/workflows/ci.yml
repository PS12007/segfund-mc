name: ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU reference only: torch/triton are never installed in CI, GPU tests are skipped.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "PyYAML>=6.0" "matplotlib>=3.8" "pytest>=8"
          python -m pip install --no-deps -e .
      - name: Test
        run: python -m pytest -q -rs
