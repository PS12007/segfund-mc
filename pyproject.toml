[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segfund-mc"
version = "0.1.0"
description = "Educational Monte Carlo engine for segregated fund (variable annuity) guarantees. Not actuarially approved."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# GPU extras are installed separately on Windows (torch from the cu130 index, triton-windows from PyPI).
gpu = ["torch==2.12.0", "triton-windows==3.8.0.post28"]
test = ["pytest>=8"]

[project.scripts]
segfund = "segfund.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU with torch + triton (skipped automatically without one)",
    "slow: takes more than ~10 s",
]
